sonar.projectKey=VirtoCommerce_vc-theme-b2b-vue
sonar.organization=virto-commerce

# General code rules
# client-app/core-api/contract/** is the generated @vc-frontend/core type contract +
# tailwind preset snapshot — committed by design, not hand-written code to analyze.
sonar.exclusions=client-app/core/api/graphql/**/types.ts, client-app/modules/**/api/graphql/types.ts, client-app/core-api/contract/**

# Code duplication rules
sonar.cpd.exclusions=**/*.mock.ts, **/*.test.ts, **.*.stories.ts, client-app/pages/matcher/builderIo/customComponents.ts

# Turn off ""void" should not be used"
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.e1.resourceKey=**

# Web:MouseEventWithoutKeyboardEquivalentCheck, twice, where the rule reads the markup and gets the
# fact wrong. It is scoped to these two files rather than switched off: everywhere else the rule is
# worth having, and a genuine mouse-only control in either file should still be caught by review.
#
# The mobile menu's overlay is a dimmer marked aria-hidden, not a control. Clicking it is a pointer
# shortcut for something the keyboard already has twice over — the panel answers Escape from
# anywhere (onKeyStroke in mobile-menu.vue) and carries its own labelled ✕. Making the dimmer
# focusable would put a nameless stop ahead of the panel on every Tab into an open menu.
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=client-app/shared/layout/components/header/_internal/mobile-menu/mobile-menu.vue

# The account panel delegates one click listener over its two columns because AccountNavigationItem
# has two root nodes and Vue drops a listener bound on a fragment. Every target it acts on is a
# router-link, i.e. an <a href>, and activating a link from the keyboard dispatches a click that
# bubbles to the same div — so the delegated path already runs for keyboard users, and a keydown
# handler there would only duplicate it.
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e3.resourceKey=client-app/shared/layout/components/header/_internal/header-account-menu-panel.vue
