sonar.projectKey=VirtoCommerce_vc-theme-b2b-vue
sonar.organization=virto-commerce

# General code rules
# client-app/core-api/contract/** is the generated @vc-frontend/core type contract +
# tailwind preset snapshot — committed by design, not hand-written code to analyze.
sonar.exclusions=client-app/core/api/graphql/**/types.ts, client-app/modules/**/api/graphql/types.ts, client-app/core-api/contract/**

# Code duplication rules
sonar.cpd.exclusions=**/*.mock.ts, **/*.test.ts, **.*.stories.ts, client-app/pages/matcher/builderIo/customComponents.ts

sonar.issue.ignore.multicriteria=e1,e2,e3

# Turn off ""void" should not be used"
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.e1.resourceKey=**

# S6819 asks for a native element instead of the combobox/listbox role. Neither widget below can
# have one: the options carry checkboxes, radio buttons and consumer markup, which <select> and
# <datalist> cannot hold, and the trigger renders whatever the consumer puts in its slot. They are
# the WAI-ARIA APG combobox with listbox popup, and the roles are what make aria-activedescendant
# and aria-controls legal there. Kept file by file, so the rule still catches app code that could
# simply have used the native element.
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e2.resourceKey=**/vc-select*.vue
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e3.resourceKey=**/top-header-organizations.vue
