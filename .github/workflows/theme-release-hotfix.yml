name: Theme Release Hotfix
on:
  workflow_dispatch:

jobs:
  ci:
    # Upstream (repo id 296335982 = VirtoCommerce/vc-frontend, rename-proof) or a repo with VC_RELEASE=true: skipped in the private theme mirror (VCST-5970).
    if: (github.repository_id == '296335982' || vars.VC_RELEASE == 'true')
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
      GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
      BLOB_SAS: ${{ secrets.BLOB_TOKEN }}
      VERSION_SUFFIX: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check per-repository settings
        # Outside vc-frontend, the Sonar key would otherwise fall back to vc-frontend's project and overwrite its analysis.
        if: ${{ github.repository_id != '296335982' }}
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::error::Set the SONAR_PROJECT_KEY repository variable: without it SonarCloud analyses go to vc-frontend's project."
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Enable corepack
        run: |
          corepack enable

      - name: Setup sonarqube
        uses: warchant/setup-sonar-scanner@911ef81b14b267a261d70ac94e43d3c822a709d5 # v10

      - name: Install VirtoCommerce.GlobalTool
        uses: VirtoCommerce/.github/actions/setup-vcbuild@v3.1000.1

      - name: Setup Git Credentials
        uses: VirtoCommerce/.github/actions/setup-git-credentials-github@v3.1000.1
        with:
          githubToken: ${{ secrets.REPO_TOKEN }}

      - name: Get Image Version
        uses: VirtoCommerce/.github/actions/get-image-version@v3.1000.1
        id: image
        with:
          projectType: "theme"

      - name: Set VERSION_SUFFIX variable
        run: |
          echo "VERSION_SUFFIX=${{ steps.image.outputs.suffix }}" >> $GITHUB_ENV

      - name: Set VERSION
        run: |
          echo "VERSION=${{ steps.image.outputs.prefix }}" >> $GITHUB_ENV

      - name: Update package.json Version
        run: |
          yarn version ${{ env.VERSION }}

      - name: Install dependencies
        run: |
          yarn install

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        with:
          args: ${{ vars.SONAR_PROJECT_KEY && format('-Dsonar.projectKey={0}', vars.SONAR_PROJECT_KEY) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build
        run: |
          yarn build

      - name: Unit Tests
        run: |
          yarn test:unit --run

      - name: Typing Tests
        run: |
          yarn test:typing --run

      - name: Add files to zip
        run: |
          mkdir -p ./tmp/default
          mkdir ./artifacts
          mv ./dist/* ./tmp/default
          cd ./tmp
          # zip -r ../artifacts/$(jq -r .name ../package.json)-$(jq -r .version ../package.json).zip ./default
          zip -r ../artifacts/${GITHUB_REPOSITORY#*/}-${{ steps.image.outputs.prefix }}.zip ./default

      - name: Publish to Blob
        id: blobRelease
        uses: VirtoCommerce/.github/actions/publish-blob-release@v3.1000.1
        with:
          blobSAS: ${{ secrets.BLOB_TOKEN }}

      - name: Create GH Release
        env:
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
        run: |
          gh release create "$IMAGE_PREFIX" \
                --target="$GITHUB_REF_NAME" \
                --latest=false \
                --repo="$GITHUB_REPOSITORY" \
                --title="$IMAGE_PREFIX" \
                "./artifacts/${GITHUB_REPOSITORY#*/}-${IMAGE_PREFIX}.zip#${GITHUB_REPOSITORY#*/}-${IMAGE_PREFIX}.zip"
