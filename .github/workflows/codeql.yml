name: CodeQL

# GitHub-native deep dataflow SAST for JS/TS (VCST-5292). Free for public repos;
# results appear in the repository Security tab. Runs the security-extended query
# suite. CodeQL needs no build step for interpreted JS/TS.

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    paths-ignore:
      - '.idea'
      - '.vscode'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.idea'
      - '.vscode'
      - 'README.md'
      - 'LICENSE'
  schedule:
    - cron: '17 4 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # Upstream (repo id 296335982 = VirtoCommerce/vc-frontend, rename-proof) or a repo with VC_CI=true: skipped in the private theme mirror (VCST-5970).
    if: ${{ (github.repository_id == '296335982' || vars.VC_CI == 'true') &&
         github.actor != 'dependabot[bot]' &&
         (github.event.pull_request.head.repo.full_name == github.repository ||
         github.event.pull_request.head.repo.full_name == '') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      # Skip a finding: dismiss the alert in Security > Code scanning (False positive /
      # Won't fix), or add a top-level "paths-ignore:" above to exclude paths.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:javascript-typescript'
