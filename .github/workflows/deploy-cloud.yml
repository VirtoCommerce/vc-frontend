# v1.0.0.vcst
name: VC cloud deployment
on:
  workflow_call:
    inputs:
      cmPath:
        description: 'JSON configuration map file path (with quotes)'
        required: false
        type: string
      artifactKey:
        description: 'JSON configuration map property key (with quotes)'
        required: false
        type: string
      artifactUrl:
        description: 'Artifact (zip/docker image) URL'
        required: true
        type: string
      environmentId:
        description: 'Environment ID (dev, qa)'
        default: 'dev'
        required: false
        type: string
      jiraKeys:
        description: 'Deployed artifact Jira keys'
        required: false
        default: ''
        type: string
      forceCommit:
        description: 'Flag to create deploy commit without PR. If true - create commit into deployBranch and don`t create PR'
        required: false
        default: false
        type: boolean
      cloudUrl:
        description: 'Cloud URL for checking status'
        default: 'https://portal.virtocommerce.cloud'
        required: false
        type: string
    secrets:
      REPO_TOKEN:
        description: 'GitHub token used to create the deploy PR/commit and update deployment status'
        required: true
      VIRTOCLOUD_KEY_VCPT_VCST:
        description: 'Virto Cloud token used to check deployment status'
        required: false
      CLOUD_INSTANCE_BASE_URL:
        description: 'Jira cloud instance base URL (for pushing deployment info)'
        required: false
      CLIENT_ID:
        description: 'Jira client id (for pushing deployment info)'
        required: false
      CLIENT_SECRET:
        description: 'Jira client secret (for pushing deployment info)'
        required: false
  workflow_dispatch:
    inputs:
      cmPath:
        description: 'JSON configuration map file path (with quotes)'
        required: false
        type: string
      artifactKey:
        description: 'JSON configuration map property key (with quotes)'
        required: false
        type: string
      artifactUrl:
        description: 'Artifact (zip/docker image) URL'
        required: true
        type: string
      environmentId:
        description: 'Environment ID (dev, qa)'
        default: 'dev'
        required: false
        type: string
      jiraKeys:
        description: 'Deployed artifact Jira keys'
        required: false
        default: ''
        type: string
      cloudUrl:
        description: 'Cloud URL for checking status'
        default: 'https://portal.virtocommerce.cloud'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{secrets.CLIENT_ID}}
      CLIENT_SECRET: ${{secrets.CLIENT_SECRET}}
      CLOUD_INSTANCE_BASE_URL: ${{secrets.CLOUD_INSTANCE_BASE_URL}}
      CLOUD_URL: ${{ inputs.cloudUrl }}
      DEPLOY_STATE: ''
      GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
      SLEEP_TIME: '3m'
      VIRTOCLOUD_KEY: ${{ secrets.VIRTOCLOUD_KEY_VCPT_VCST }}

    steps:

    - name: Read deployment config
      uses: VirtoCommerce/vc-github-actions/get-deploy-param@59eabc1faa8c97ee0c7725d32a1f9d651ec5fea2 # master
      id: deployConfig
      with:
        envName: ${{ inputs.environmentId }}
        deployConfigPath: .deployment/theme/cloudDeploy.json

    - name: Start deployment
      uses: VirtoCommerce/vc-github-actions/gh-deployments@59eabc1faa8c97ee0c7725d32a1f9d651ec5fea2 # master
      id: deployment
      with:
        step: start
        token: ${{ env.GITHUB_TOKEN }}
        env: ${{ steps.deployConfig.outputs.environmentName }}
        no_override: false

    - name: Deploy to ${{ steps.deployConfig.outputs.environmentName }}
      uses: VirtoCommerce/vc-github-actions/create-deploy-pr@59eabc1faa8c97ee0c7725d32a1f9d651ec5fea2 # master
      with:
        githubToken: ${{ env.GITHUB_TOKEN }}
        deployRepo: ${{ steps.deployConfig.outputs.deployRepo }}
        deployBranch: ${{ steps.deployConfig.outputs.deployBranch }}
        cmPath: ${{ inputs.cmPath || steps.deployConfig.outputs.cmPath }}
        artifactKey: '"${{ inputs.artifactKey || steps.deployConfig.outputs.artifactKey }}"'
        artifactUrl: '"${{ inputs.artifactUrl }}"'
        taskNumber: ${{ inputs.jiraKeys }}
        forceCommit: ${{ inputs.forceCommit }}

    - name: Sleep for ${{ env.SLEEP_TIME }}
      if: ${{ inputs.forceCommit }}
      run: sleep ${{ env.SLEEP_TIME }}
      shell: bash

    - name: Check deployment status
      if: ${{ inputs.forceCommit }}
      timeout-minutes: 5
      run: |
        dotnet tool install --global VirtoCommerce.GlobalTool || true
        vc-build CloudEnvStatus -CloudUrl $CLOUD_URL -CloudToken $VIRTOCLOUD_KEY -EnvironmentName ${{ steps.deployConfig.outputs.deployAppName }} -HealthStatus Healthy -SyncStatus Synced
      shell: bash

    - name: DEPLOY_STATE::successful
      if: success()
      run: echo "DEPLOY_STATE=successful" >> $GITHUB_ENV

    - name: DEPLOY_STATE::failed
      if: failure()
      run: echo "DEPLOY_STATE=failed"  >> $GITHUB_ENV

    - name: Update GitHub deployment status
      uses: VirtoCommerce/vc-github-actions/gh-deployments@59eabc1faa8c97ee0c7725d32a1f9d651ec5fea2 # master
      if: always()
      with:
        step: finish
        token: ${{ env.GITHUB_TOKEN }}
        status: ${{ job.status }}
        env: ${{ steps.deployment.outputs.env }}
        deployment_id: ${{ steps.deployment.outputs.deployment_id }}

    - name: Push Deployment Info to Jira
      if: ${{ env.CLOUD_INSTANCE_BASE_URL != 0 && env.CLIENT_ID != 0 && env.CLIENT_SECRET != 0 && inputs.jiraKeys != '' && always() }}
      id: push_deployment_info_to_jira
      uses: VirtoCommerce/jira-upload-deployment-info@075189e412c50d1824fc481edd6c606dc062af9a # master
      env:
        CLOUD_INSTANCE_BASE_URL: ${{secrets.CLOUD_INSTANCE_BASE_URL}}
        CLIENT_ID: ${{secrets.CLIENT_ID}}
        CLIENT_SECRET: ${{secrets.CLIENT_SECRET}}
      with:
        cloud-instance-base-url: ${{ secrets.CLOUD_INSTANCE_BASE_URL }}
        client-id: ${{ secrets.CLIENT_ID }}
        client-secret: ${{ secrets.CLIENT_SECRET }}
        deployment-sequence-number: ${{ github.run_id }}
        update-sequence-number: ${{ github.run_id }}
        issue-keys: ${{ inputs.jiraKeys }}
        display-name: ${{ steps.deployConfig.outputs.deployAppName }}
        url: ${{ steps.deployConfig.outputs.environmentUrl }}
        label: ${{ steps.deployConfig.outputs.environmentName }}
        description: 'Deployment to the ${{ steps.deployConfig.outputs.environmentName }} environment'
        last-updated: '${{github.event.head_commit.timestamp}}'
        state: '${{ env.DEPLOY_STATE }}'
        pipeline-id: '${{ github.repository }} ${{ github.workflow }}'
        pipeline-display-name: 'Workflow: ${{ github.workflow }} (#${{ github.run_number }})'
        pipeline-url: '${{github.event.repository.html_url}}/actions/runs/${{github.run_id}}'
        environment-id: ${{ steps.deployConfig.outputs.environmentId }}
        environment-display-name: ${{ steps.deployConfig.outputs.environmentName }}
        environment-type: ${{ steps.deployConfig.outputs.environmentType }}
