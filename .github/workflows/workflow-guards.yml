name: Verify workflow repository guards

# Every job must say which repository it runs in (VCST-5970). This repo is also synced
# into a private theme mirror, where upstream CI, releases and deploys must not run and
# only the mirror's own build/sync jobs may. A job's `if:` has to start with one of:
#
#   github.repository == 'VirtoCommerce/vc-frontend'   upstream-only
#   vars.THEME_MIRROR == 'true'                         mirror-only
#
# optionally followed by `&& <rest>`, where <rest> contains no top-level `||` (wrap it in
# parentheses otherwise): `guard && a || b` would still run `b` in the wrong repository.

on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  guards:
    if: github.repository == 'VirtoCommerce/vc-frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check every job has a repository guard
        run: |
          status=0
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$file" ] || continue
            while IFS= read -r row; do
              job=$(jq -r .job <<< "$row")
              cond=$(jq -r .if <<< "$row" | tr '\n' ' ' | sed -E 's/^[[:space:]]*(\$\{\{)?[[:space:]]*//; s/[[:space:]]*(\}\})?[[:space:]]*$//; s/[[:space:]]+/ /g')
              rest=$(printf '%s' "$cond" | sed -E "s/^(github\.repository == 'VirtoCommerce\/vc-frontend'|vars\.THEME_MIRROR == 'true')//")
              if [ "$rest" = "$cond" ]; then
                echo "::error file=$file::Job '$job' has no repository guard. Start its if: with github.repository == 'VirtoCommerce/vc-frontend' (or vars.THEME_MIRROR == 'true' for mirror-only jobs)."
                status=1
                continue
              fi
              rest=$(printf '%s' "$rest" | sed -E 's/^ *&& *//')
              # Reject a `||` outside parentheses and outside '...' string literals.
              if ! awk -v s="$rest" 'BEGIN {
                  d = 0; q = 0
                  for (i = 1; i <= length(s); i++) {
                    c = substr(s, i, 1)
                    if (c == "\047") q = !q
                    else if (!q && c == "(") d++
                    else if (!q && c == ")") d--
                    else if (!q && d == 0 && substr(s, i, 2) == "||") exit 1
                  }
                }'; then
                echo "::error file=$file::Job '$job': the condition after the repository guard has a top-level ||. Wrap it in parentheses: guard && ( ... )."
                status=1
              fi
            done < <(yq -o=json -I=0 '.jobs | to_entries | .[] | {"job": .key, "if": (.value.if // "")}' "$file")
          done
          exit $status
