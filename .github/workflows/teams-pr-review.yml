name: Notify Teams about PR reviews

# One card per PR in the Teams "PR review" channel, kept in sync with the review state (VCST-6259).
# The action builds the card, a Teams Workflows flow posts or updates it. Secrets: TEAMS_PR_WEBHOOK
# (the flow URL) and TEAMS_USERS ({"github-login": "Entra Object ID"}).
# Without secrets (Dependabot and fork PRs) the action skips the run.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft,
            review_requested, review_request_removed, closed,
            synchronize, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  card:
    # Upstream (repo id 296335982 = VirtoCommerce/vc-frontend, rename-proof) or a repo with VC_CI=true: skipped in the private theme mirror (VCST-5970).
    if: (github.repository_id == '296335982' || vars.VC_CI == 'true')
    runs-on: ubuntu-latest
    # One PR's card runs in order, so a slower run never overwrites the card with an older state and two runs never
    # post two cards. GitHub cancels queued runs in between, which is fine here: every run rebuilds the whole card.
    concurrency:
      group: teams-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: read
    steps:
      - uses: VirtoCommerce/.github/actions/teams-pr-review-notification@vcst-6259-teams-comments-debounce
        with:
          mode: card
          webhook-url: ${{ secrets.TEAMS_PR_WEBHOOK }}
          teams-users: ${{ secrets.TEAMS_USERS }}
          jira-projects: VCST

  ping:
    # Re-review and review comments messages. A comment review waits 2 minutes before its message, so comment reviews get
    # a group per PR and reviewer: a newer comment cancels the waiting run and the last one sends the message. Every other
    # run gets its own group (run_id), so a re-review message or an approval never cancels a waiting comment message.
    if: (github.repository_id == '296335982' || vars.VC_CI == 'true') && (github.event.action == 'review_requested' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    concurrency:
      group: teams-ping-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["commented","changes_requested"]'), github.event.review.state) && github.event.review.user.login || github.run_id }}
      cancel-in-progress: true
    permissions:
      pull-requests: read
    steps:
      - uses: VirtoCommerce/.github/actions/teams-pr-review-notification@vcst-6259-teams-comments-debounce
        with:
          mode: ping
          webhook-url: ${{ secrets.TEAMS_PR_WEBHOOK }}
          teams-users: ${{ secrets.TEAMS_USERS }}
