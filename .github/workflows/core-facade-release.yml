# Publishes the @vc-frontend/core facade as a versioned tarball Release asset, so
# out-of-repo Module Federation plugins can pin it by URL with no registry or token:
#
#   https://github.com/VirtoCommerce/vc-frontend/releases/download/core-v<V>/vc-frontend-core-<V>.tgz
#
# Manual-only by design: the contract version bumps automatically on facade changes
# (yarn build:core-types), but a human decides when a version becomes consumable.
# Releases are immutable — re-running for an already-released version fails; bump the
# contract version instead. Never delete stable core-v* releases: a deleted release is the
# only way a plugin's pin can break.
#
# The branch picks the kind of release. Stable core-v* releases come only from the repo's
# default branch (dev upstream, whatever a VC_RELEASE fork uses): one
# from a feature branch would permanently occupy that contract version with unmerged code.
# Any other branch publishes a GitHub pre-release of its contract version,
# core-v<V>-alpha.<run>.<branch>, so a plugin PR can build and deploy against a
# facade that is not on dev yet. Nothing is committed: the suffix exists only in the packed
# package.json. Pre-releases are temporary — the stable release of <V> (or any later version)
# deletes them, so a plugin must move its pin to a stable release before it merges.
#
# See client-app/core-api/README.md and
# client-app/core/specs/VCST-5159-module-federation/2026-07-06-facade-distribution-design.md.
name: Core Facade Release

run-name: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('@vc-frontend/core stable release from {0}', github.ref_name) || format('@vc-frontend/core alpha from {0}', github.ref_name) }}

on:
  workflow_dispatch:

jobs:
  release:
    # Upstream (repo id 296335982 = VirtoCommerce/vc-frontend, rename-proof) or a repo with VC_RELEASE=true: skipped in the private theme mirror (VCST-5970).
    if: (github.repository_id == '296335982' || vars.VC_RELEASE == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the core-v* tag + release (and delete superseded pre-releases) with the built-in GITHUB_TOKEN
    env:
      FORCE_COLOR: true
      PRERELEASE: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Enable corepack
        run: |
          corepack enable

      # Full history + tags: the bump guard judges this contract against the last published
      # core-v* tag, and a shallow checkout would silently retire that gate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Read contract version
        id: core
        run: |
          base=$(jq -r .version client-app/core-api/package.json)
          version=$base
          if [ "$PRERELEASE" = "true" ]; then
            # alpha.<run number> keeps alphas ordered (numeric identifiers compare numerically);
            # the branch's last path segment says where it came from.
            slug=$(printf '%s' "${GITHUB_REF_NAME##*/}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^0-9a-z-]/-/g' | cut -c1-40 | sed -e 's/-*$//')
            # An all-digit identifier must not have a leading zero; a letter makes it alphanumeric.
            case "$slug" in *[!0-9]*) ;; ?*) slug="b$slug" ;; esac
            version="$base-alpha.$GITHUB_RUN_NUMBER${slug:+.$slug}"
          fi
          # Own-repo input, but $GITHUB_OUTPUT is newline-delimited — reject anything
          # that is not a plain semver string before it can smuggle extra output lines.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Facade version \"$version\" is not a valid semver string."
            exit 1
          fi
          {
            echo "base=$base"
            echo "version=$version"
            echo "tag=core-v$version"
            echo "tarball=vc-frontend-core-$version.tgz"
          } >> "$GITHUB_OUTPUT"

      # An alpha of an already-released version sorts BELOW that release, and the next stable
      # release would delete it at once. A branch that changed the facade has a bumped version
      # (yarn build:core-types); one that did not has nothing to pre-release.
      - name: Fail if the pre-release base version is already released
        if: env.PRERELEASE == 'true'
        env:
          BASE: ${{ steps.core.outputs.base }}
        run: |
          if ! printf '%s' "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::A pre-release needs a plain X.Y.Z contract version to suffix, got \"$BASE\"."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/core-v$BASE" > /dev/null 2>&1; then
            echo "::error::core-v$BASE is already released. Change the facade and run yarn build:core-types" \
              "(it bumps the version), or bump it with yarn bump:core, then commit and re-run."
            exit 1
          fi

      # Releases are immutable: the plugin-side pin (URL + lockfile checksum) must never
      # change meaning. A new contract means a new CORE_VERSION, not a re-release.
      # The TAG is checked too, not just the release: `gh release create` on a
      # pre-existing tag silently ignores --target and binds the release to the old
      # tag's commit — while the tarball is packed from THIS checkout. Tag and asset
      # would diverge.
      - name: Fail if this contract version is already released or tagged
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.core.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists — releases are immutable." \
              "Bump the contract version (yarn build:core-types auto-bumps on facade" \
              "changes; for a breaking one run yarn bump:core with the level that"\
              "release line uses - minor on 0.x, major from 1.0.0) and re-run."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG already exists (without a release) — creating a release" \
              "on it would bind to that tag's commit instead of this run's. Delete the stray" \
              "tag or bump the contract version."
            exit 1
          fi

      # Dependency lifecycle scripts are disabled: this job holds a contents:write token,
      # and the drift check needs no build scripts (verified — vue-demi's is the only one
      # skipped and it is not on this code path). Supply-chain hardening, not paranoia.
      - name: Install dependencies (no lifecycle scripts, frozen lockfile)
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: |
          yarn install --immutable

      # Read-only drift check (NOT build:core-types, which regenerates and can
      # auto-bump the version — a release must pack exactly what is committed).
      - name: Validate the committed contract
        run: |
          yarn validate:core-types

      # After the drift check, which judges the committed version. Only the packed copy carries the suffix.
      - name: Stamp the pre-release version
        if: env.PRERELEASE == 'true'
        working-directory: client-app/core-api
        env:
          VERSION: ${{ steps.core.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Pack the facade tarball
        working-directory: client-app/core-api
        run: |
          npm pack

      - name: Create release with tarball asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.core.outputs.version }}
          TAG: ${{ steps.core.outputs.tag }}
          TARBALL: ${{ steps.core.outputs.tarball }}
          BASE: ${{ steps.core.outputs.base }}
        run: |
          {
            echo "Type contract + federation config of the storefront host facade, for Module Federation plugin builds."
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "> [!WARNING]"
              echo "> Pre-release from \`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA:0:9}\`. It is deleted when \`core-v${BASE}\` or a later version is released:"
              echo "> pin a stable release before the plugin merges."
              echo
            fi
            echo "Pin it in a plugin's package.json:"
            echo
            echo '```json'
            echo "\"@vc-frontend/core\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$TARBALL\""
            echo '```'
            echo
            echo "Docs: [client-app/core-api/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/client-app/core-api/README.md)"
          } > release-notes.md
          # --latest=false: facade releases must never steal the repo's "Latest" badge
          # from theme releases (theme-ci sets make_latest: true) — anything consuming
          # releases/latest expects the theme zip, not this tarball.
          gh release create "$TAG" "client-app/core-api/$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "@vc-frontend/core $VERSION" \
            --latest=false \
            --prerelease="$PRERELEASE" \
            --notes-file release-notes.md

      # A stable release supersedes every alpha below it: its own and older versions' ones. Alphas
      # of a later version (a parallel branch ahead of this release) stay. The release is already
      # out, so a failed delete only warns.
      - name: Delete superseded facade pre-releases
        if: env.PRERELEASE == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.core.outputs.version }}
        run: |
          if ! tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("core-v"))) | .tagName'); then
            echo "::warning::Could not list releases; superseded facade pre-releases were not deleted."
            exit 0
          fi
          superseded=$(printf '%s\n' "$tags" | node -e '
            const { lt, prerelease, valid } = require("semver");
            const lines = require("fs").readFileSync(0, "utf8").split("\n").filter(Boolean);
            for (const tag of lines) {
              const v = tag.slice("core-v".length);
              if (valid(v) && prerelease(v) && lt(v, process.env.VERSION)) console.log(tag);
            }')
          for tag in $superseded; do
            if gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then
              echo "Deleted $tag"
            else
              echo "::warning::Could not delete pre-release $tag."
            fi
          done
