# Every slice is gated, because the two surfaces that run this op render different cards and a rep can
# hide any of them. The flags come from the visible cards (layout/stat-data-needs.ts) — an excluded
# slice is a bucket the backend never aggregates, its batch loader being keyed on the date range.
# `average` rides along inside its own bucket, so it is gated for bytes rather than for a query.
# The flags are required rather than defaulted (as in searchProductsQuery): a forgotten one should be a
# compile error, not a surface quietly fetching a slice it does not render.
query SalesRepCustomerOrderStatistics(
  $organizationId: String
  $storeId: String
  $currencyCode: String
  $cultureName: String
  $mtdFrom: DateTime
  $mtdTo: DateTime
  $prevFrom: DateTime
  $prevTo: DateTime
  $ytdFrom: DateTime
  $ytdTo: DateTime
  $lastYearFrom: DateTime
  $lastYearTo: DateTime
  $weekFrom: DateTime
  $weekTo: DateTime
  $prevWeekFrom: DateTime
  $prevWeekTo: DateTime
  $recentFrom: DateTime
  $recentTo: DateTime
  $newOrdersFilter: String
  $withNewOrders: Boolean!
  $withWeek: Boolean!
  $withMtd: Boolean!
  $withMonthOverMonth: Boolean!
  $withYtd: Boolean!
  $withYearOverYear: Boolean!
  $withAverageOrderValue: Boolean!
) {
  salesRepCustomerOrderStatistics(
    organizationId: $organizationId
    storeId: $storeId
    currencyCode: $currencyCode
    cultureName: $cultureName
  ) {
    currencyCode
    mtd: period(from: $mtdFrom, to: $mtdTo) @include(if: $withMtd) {
      total {
        amount
        formattedAmount
      }
      count
    }
    ytd: period(from: $ytdFrom, to: $ytdTo) @include(if: $withYtd) {
      total {
        amount
        formattedAmount
      }
      count
      # Backs the customer profile's "Avg order value"; the dashboard has no such card.
      average @include(if: $withAverageOrderValue) {
        amount
        formattedAmount
      }
    }
    week: period(from: $weekFrom, to: $weekTo) @include(if: $withWeek) {
      total {
        amount
        formattedAmount
      }
      count
    }
    newOrders: period(from: $recentFrom, to: $recentTo, filter: $newOrdersFilter) @include(if: $withNewOrders) {
      total {
        amount
        formattedAmount
      }
      count
    }
    recentOrders: period(from: $recentFrom, to: $recentTo) @include(if: $withNewOrders) {
      count
    }
    # A comparison re-uses the bucket its `current` range already selected, so these cost only their
    # baseline: the previous week, month and year respectively.
    #
    # Only `countChangePercent` is rendered today. The signed `totalChange`/`countChange` and
    # `totalChangePercent` are kept selected pending the product decision in VCST-5647 (surface them, or
    # stop asking) — with the gating above, that decision can now differ per surface.
    weekVsPrevWeek: comparison(
      current: { from: $weekFrom, to: $weekTo }
      previous: { from: $prevWeekFrom, to: $prevWeekTo }
    ) @include(if: $withWeek) {
      totalChange {
        amount
        formattedAmount
      }
      totalChangePercent
      countChange
      countChangePercent
    }
    mtdVsPrevMonth: comparison(current: { from: $mtdFrom, to: $mtdTo }, previous: { from: $prevFrom, to: $prevTo })
      @include(if: $withMonthOverMonth) {
      totalChange {
        amount
        formattedAmount
      }
      totalChangePercent
      countChange
      countChangePercent
    }
    ytdVsLastYear: comparison(
      current: { from: $ytdFrom, to: $ytdTo }
      previous: { from: $lastYearFrom, to: $lastYearTo }
    ) @include(if: $withYearOverYear) {
      totalChange {
        amount
        formattedAmount
      }
      totalChangePercent
      countChange
      countChangePercent
    }
  }
}
