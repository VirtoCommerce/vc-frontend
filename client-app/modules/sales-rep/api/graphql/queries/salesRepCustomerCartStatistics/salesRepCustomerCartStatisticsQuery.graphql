query SalesRepCustomerCartStatistics(
  $organizationId: String
  $storeId: String
  $currencyCode: String
  $cultureName: String
  $cartFilter: String
  $weekFrom: DateTime
  $weekTo: DateTime
) {
  salesRepCustomerCartStatistics(
    organizationId: $organizationId
    storeId: $storeId
    currencyCode: $currencyCode
    cultureName: $cultureName
  ) {
    currencyCode
    activeCarts: period(filter: $cartFilter) {
      count
      selectedItemQuantity
      unselectedItemQuantity
      total {
        amount
        formattedAmount
      }
    }
    itemsThisWeek: period(from: $weekFrom, to: $weekTo, filter: $cartFilter) {
      selectedItemQuantity
    }
  }
}
