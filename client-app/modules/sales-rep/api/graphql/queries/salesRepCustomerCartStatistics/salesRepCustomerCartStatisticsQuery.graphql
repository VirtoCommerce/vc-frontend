query SalesRepCustomerCartStatistics(
  $organizationId: String
  $storeId: String
  $cartFilter: String
  $weekFrom: DateTime
  $weekTo: DateTime
) {
  salesRepCustomerCartStatistics(organizationId: $organizationId, storeId: $storeId) {
    activeCarts: period(filter: $cartFilter) {
      selectedItemQuantity
      unselectedItemQuantity
    }
    itemsThisWeek: period(from: $weekFrom, to: $weekTo, filter: $cartFilter) {
      selectedItemQuantity
    }
  }
}
