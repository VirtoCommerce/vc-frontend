query SalesRepCustomerOrders(
  $organizationId: String
  $storeId: String
  $cultureName: String
  $first: Int
  $after: String
  $sort: String
  $filter: String
  $facet: String
) {
  salesRepCustomerOrders(
    organizationId: $organizationId
    storeId: $storeId
    cultureName: $cultureName
    first: $first
    after: $after
    sort: $sort
    filter: $filter
    facet: $facet
  ) {
    totalCount
    items {
      id
      number
      organizationId
      organizationName
      customerId
      createdDate
      status
      statusDisplayValue
      total {
        formattedAmount
      }
    }
    term_facets {
      name
      terms {
        term
        label
        count
      }
    }
  }
}
