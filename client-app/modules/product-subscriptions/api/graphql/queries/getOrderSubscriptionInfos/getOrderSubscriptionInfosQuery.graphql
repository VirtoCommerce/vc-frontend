query GetOrderSubscriptionInfos($orderIds: [String!]!) {
  orderSubscriptionInfos(orderIds: $orderIds) {
    orderId
    renewalId
    renewalNumber
    renewalScheduledDate
    isManualRenewal
    subscriptions {
      subscriptionId
      subscriptionNumber
      productId
      intervalUnit
      intervalCount
      status
      isStartedByOrder
    }
  }
}
