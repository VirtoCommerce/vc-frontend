fragment renewalFields on SubscriptionRenewal {
  id
  number
  state
  scheduledDate
  cutoffDate
  isManual
  currency
  previewTotal
  notifiedTotal
  orderTotal
  discountTotal
  shippingTotal
  taxTotal
  orderId
  orderNumber
