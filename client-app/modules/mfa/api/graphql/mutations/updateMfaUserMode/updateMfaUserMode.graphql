mutation UpdateMfaUserMode($command: InputUpdateMfaUserModeType!) {
  updateMfaUserMode(command: $command) {
    succeeded
    errorCode
    errorDescription
    lockoutSecondsRemaining
    settings {
      storeId
      storeMode
      isRequired
      requiredBy
      userMode
      canChangeUserMode
      organizationId
      organizationMode
      canChangeOrganizationMode
      isProviderAvailable
      provider
      destination
    }
  }
}
