query InitializeApplication($domain: String!) {
  store(domain: $domain) {
    storeUrl
    settings {
      modules {
        moduleId
        version
        settings {
          name
          value
        }
      }
    }
    plugins(appId: "vc-frontend") {
      id
      version
      permission
      entry {
        type
        path
        hash
      }
      contentFiles {
        type
        path
        hash
      }
      remote {
        name
        exposed
      }
    }
  }
}
