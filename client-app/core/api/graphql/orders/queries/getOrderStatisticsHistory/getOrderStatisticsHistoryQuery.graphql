# Whether the signed-in user ever ordered (or, with `isOrganizationScope`, the organization): the Sales Statistics show
# their empty state instead of tiles and charts of zeros when not. Its own operation, with variables a period switch
# never changes, so switching the report's period does not make the backend count the whole history again.
query GetOrderStatisticsHistory(
  $storeId: String
  $currencyCode: String
  $cultureName: String
  $isOrganizationScope: Boolean
) {
  orderStatistics(
    storeId: $storeId
    currencyCode: $currencyCode
    cultureName: $cultureName
    isOrganizationScope: $isOrganizationScope
  ) {
    all: period {
      count
      excludedCount
    }
  }
}
