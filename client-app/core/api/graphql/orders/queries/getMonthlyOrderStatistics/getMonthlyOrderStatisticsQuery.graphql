    }
    m11: period(from: $from11, to: $to11) @include(if: $use11) {
      count
      total {
        amount
      }
      excludedCount
    }
    ly11: period(from: $lyFrom11, to: $lyTo11) @include(if: $use11) {
      count
      total {
        amount
      }
    }
  }
}
