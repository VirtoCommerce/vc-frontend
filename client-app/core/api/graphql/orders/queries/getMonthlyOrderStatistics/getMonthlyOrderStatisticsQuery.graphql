# The account dashboard's Sales Statistics (VCST-6258): the signed-in user's OWN orders, as the stat cards count them
# (GetOrderStatistics), so the two agree. One bucket per month of the selected period (up to 12) with the same month
# last year, and the month before the period for the first month's "vs previous month". The statistics already leave
# Cancelled orders out. `use<N>` switches off the slots a shorter period does not fill and the months that have not
# started. `organizationScope` (and `memberId`) count the current organization's orders, or one member's, instead
# (Company → Reporting, VCST-6651); the backend checks the permission.
query GetMonthlyOrderStatistics(
  $storeId: String
  $currencyCode: String
  $cultureName: String
  $organizationScope: Boolean
  $memberId: String
  $prevFrom: DateTime
  $prevTo: DateTime
  $use0: Boolean!
  $from0: DateTime
  $to0: DateTime
  $lyFrom0: DateTime
  $lyTo0: DateTime
  $use1: Boolean!
  $from1: DateTime
  $to1: DateTime
  $lyFrom1: DateTime
  $lyTo1: DateTime
  $use2: Boolean!
  $from2: DateTime
  $to2: DateTime
  $lyFrom2: DateTime
  $lyTo2: DateTime
  $use3: Boolean!
  $from3: DateTime
  $to3: DateTime
  $lyFrom3: DateTime
  $lyTo3: DateTime
  $use4: Boolean!
  $from4: DateTime
  $to4: DateTime
  $lyFrom4: DateTime
  $lyTo4: DateTime
  $use5: Boolean!
  $from5: DateTime
  $to5: DateTime
  $lyFrom5: DateTime
  $lyTo5: DateTime
  $use6: Boolean!
  $from6: DateTime
  $to6: DateTime
  $lyFrom6: DateTime
  $lyTo6: DateTime
  $use7: Boolean!
  $from7: DateTime
  $to7: DateTime
  $lyFrom7: DateTime
  $lyTo7: DateTime
  $use8: Boolean!
  $from8: DateTime
  $to8: DateTime
  $lyFrom8: DateTime
  $lyTo8: DateTime
  $use9: Boolean!
  $from9: DateTime
  $to9: DateTime
  $lyFrom9: DateTime
  $lyTo9: DateTime
  $use10: Boolean!
  $from10: DateTime
  $to10: DateTime
  $lyFrom10: DateTime
  $lyTo10: DateTime
  $use11: Boolean!
  $from11: DateTime
  $to11: DateTime
  $lyFrom11: DateTime
  $lyTo11: DateTime
) {
  orderStatistics(
    storeId: $storeId
    currencyCode: $currencyCode
    cultureName: $cultureName
    organizationScope: $organizationScope
    memberId: $memberId
  ) {
    currencyCode
    prev: period(from: $prevFrom, to: $prevTo) {
      count
      total {
        amount
      }
    }
    m0: period(from: $from0, to: $to0) @include(if: $use0) {
      count
      total {
        amount
      }
      excludedCount
    }
    ly0: period(from: $lyFrom0, to: $lyTo0) @include(if: $use0) {
      count
      total {
        amount
      }
    }
    m1: period(from: $from1, to: $to1) @include(if: $use1) {
      count
      total {
        amount
      }
      excludedCount
    }
    ly1: period(from: $lyFrom1, to: $lyTo1) @include(if: $use1) {
      count
      total {
        amount
      }
    }
    m2: period(from: $from2, to: $to2) @include(if: $use2) {
      count
      total {
        amount
      }
      excludedCount
    }
    ly2: period(from: $lyFrom2, to: $lyTo2) @include(if: $use2) {
      count
      total {
        amount
      }
    }
    m3: period(from: $from3, to: $to3) @include(if: $use3) {
      count
      total {
        amount
      }
      excludedCount
    }
    ly3: period(from: $lyFrom3, to: $lyTo3) @include(if: $use3) {
      count
      total {
        amount
      }
    }
    m4: period(from: $from4, to: $to4) @include(if: $use4) {
      count
      total {
        amount
      }
      excludedCount
    }
    ly4: period(from: $lyFrom4, to: $lyTo4) @include(if: $use4) {
      count
      total {
        amount
      }
    }
    m5: period(from: $from5, to: $to5) @include(if: $use5) {
      count
      total {
        amount
      }
      excludedCount
    }
    ly5: period(from: $lyFrom5, to: $lyTo5) @include(if: $use5) {
      count
      total {
        amount
      }
    }
    m6: period(from: $from6, to: $to6) @include(if: $use6) {
      count
      total {
        amount
      }
      excludedCount
    }
    ly6: period(from: $lyFrom6, to: $lyTo6) @include(if: $use6) {
